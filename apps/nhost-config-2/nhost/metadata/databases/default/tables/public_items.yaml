table:
  name: items
  schema: public
configuration:
  column_config:
    created_at:
      custom_name: createdAt
    criteria:
      custom_name: criteria
    description:
      custom_name: description
    flagged:
      custom_name: flagged
    id:
      custom_name: id
    seq_id:
      custom_name: seqId
    sort_order:
      custom_name: sortOrder
    status_id:
      custom_name: statusId
    title:
      custom_name: title
    updated_at:
      custom_name: updatedAt
  custom_column_names:
    created_at: createdAt
    criteria: criteria
    description: description
    flagged: flagged
    id: id
    seq_id: seqId
    sort_order: sortOrder
    status_id: statusId
    title: title
    updated_at: updatedAt
  custom_root_fields: {}
array_relationships:
  - name: itemsAssignees
    using:
      foreign_key_constraint_on:
        column: item_id
        table:
          name: items_assignees
          schema: public
insert_permissions:
  - role: public
    permission:
      check: {}
      columns:
        - title
        - status_id
select_permissions:
  - role: public
    permission:
      columns:
        - id
        - title
        - status_id
        - sort_order
        - flagged
        - description
        - criteria
        - created_at
        - updated_at
        - seq_id
      filter: {}
update_permissions:
  - role: public
    permission:
      columns:
        - title
        - status_id
        - sort_order
        - flagged
        - description
        - criteria
      filter: {}
      check: null
